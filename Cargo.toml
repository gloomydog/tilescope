[package]
name = "tilescope"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "rayon"] }
rayon = "1.12.0"
resvg = "0.50.0"
zip = { version = "9.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
